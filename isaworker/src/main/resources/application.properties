# ---------------------------------------------------------------------------------------------------------------------
# workerdb: the PostgreSQL database in the container "workerPostgresClusterDB" (see docker-compose.yml).
# Defaults suit running isaworker on the desktop (localhost:5432, the port the container publishes). Inside Docker the
# compose file sets WORKERDB_URL to jdbc:postgresql://workerPostgresClusterDB:5432/workerdb. The password has no default
# on purpose: set WORKERDB_PASSWORD (see .env.example).
# The rest of the configuration (workers, Fluxnova endpoints, dialogs) is in application.yml.
# ---------------------------------------------------------------------------------------------------------------------
spring.datasource.url=${WORKERDB_URL:jdbc:postgresql://localhost:5432/workerdb}
spring.datasource.username=${WORKERDB_USER:postgres_admin}
spring.datasource.password=${WORKERDB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Connection pool (HikariCP) ---------------------------------------------------------------------------------------
# Load is small: each tenant's worker handles one task at a time and keeps a connection only for the few milliseconds of a
# read or write (never while a dialog is open). 10 connections cover many tenants; 2 stay warm.
spring.datasource.hikari.pool-name=workerdb-pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
# Wait this long for a free connection before failing the task (the engine then retries it).
spring.datasource.hikari.connection-timeout=20000
# Close surplus idle connections after 10 min; recycle every connection after 30 min (below PostgreSQL / firewall limits).
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# Probe idle connections every 5 min, so one that a firewall silently dropped is replaced, not handed to a worker.
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.validation-timeout=5000
# At start-up keep retrying for up to 60 s when the database is not accepting connections yet (the container is still
# starting), instead of failing at once.
spring.datasource.hikari.initialization-fail-timeout=60000

# --- JPA / Hibernate --------------------------------------------------------------------------------------------------
# "update": Hibernate creates the table worker_detail on first start and adds missing columns later; it never drops data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# The workers are not web requests: no session is kept open around them.
spring.jpa.open-in-view=false
# Store timestamps in UTC whatever the time zone of the machine is.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
